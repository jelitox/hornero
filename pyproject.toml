[project]
name = "hornero"
version = "0.4.0"
description = "Repo-native product loop: signals -> living memory -> SDD specs -> dispatched builds -> reports. The ovenbird builds its own house."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-pyyaml"]
documents = ["pypdf>=4"]

[project.scripts]
hornero = "hornero.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
