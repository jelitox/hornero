[project]
name = "hornero"
version = "0.4.0"
description = "Repo-native product loop: signals -> living memory -> SDD specs -> dispatched builds -> reports. The ovenbird builds its own house."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/jelitox/hornero"
Issues = "https://github.com/jelitox/hornero/issues"
Repository = "https://github.com/jelitox/hornero"
Changelog = "https://github.com/jelitox/hornero/blob/master/CHANGELOG.md"
"Release notes" = "https://github.com/jelitox/hornero/releases"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff>=0.15.22,<0.16", "mypy", "types-pyyaml"]
documents = ["pypdf>=4"]
knowledge = ["ai-parrot>=0.25.21,<0.26"]

[project.scripts]
hornero = "hornero.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
