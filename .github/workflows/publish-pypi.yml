name: Publish Python package to PyPI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build twine

      - name: Run quality gates
        run: |
          pytest -q
          ruff check .
          mypy hornero

      - name: Assign immutable PyPI version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          version="$(python scripts/ci_release_version.py \
            --pyproject pyproject.toml \
            --run-number "$RUN_NUMBER" \
            --run-attempt "$RUN_ATTEMPT" \
            --write)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Project release notes into the PyPI description
        env:
          AFTER_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          python scripts/changelog.py prepare-pypi \
            --version "$RELEASE_VERSION" \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --repository-url "$REPOSITORY_URL" \
            --write

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-test/bin/hornero" --help
          "$RUNNER_TEMP/wheel-test/bin/python" -c \
            'import importlib.metadata, os; assert importlib.metadata.version("hornero") == os.environ["RELEASE_VERSION"]'

      - name: Store distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.build.outputs.release-version }} to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/hornero/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions-${{ needs.build.outputs.release-version }}
          path: dist/

      - name: Publish distribution with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
